<script>


const perPage = 30;
let products = [];



$(document).ready(function () {
  $.ajax({
    url: '../xml/brandy-on.xml',
    dataType: 'xml',
    success: function (xml) {
      // products = [];
      $(xml).find('alcohol_info').each(function () {
        products.push($(this));
      });

      const totalPages = Math.ceil(products.length / perPage);
      renderPagination(totalPages);
      renderPage(1);



    $('*[class*="b0017"]').on('click', function() {
        window.open('b0017.html', '_blank');
    });


rLine();


    },
    error: function () {
      alert('資料載入失敗，請檢查 XML 路徑或檔案格式');
    }
  });

getRandomImage();

});






// 點擊分頁按鈕


$(document).on('click', '.p-box .b0017-1951', function () {
  window.open('b0017.html', '_blank');
});

$(document).on('click', '.pagination .page-btn', function () {
  const page = $(this).data('page');
  renderPage(page);
  $('.pagination .page-btn').removeClass('active');
  $('.pagination .page-btn[data-page="' + page + '"]').addClass('active');

rLine();

});



function rLine() {


      $('.label > * ').filter(function() {
          return $(this).text().indexOf('-') >= 0;
      }).hide();

}




// 產生分頁按鈕
function renderPagination(totalPages) {
  let html = '';
  for (let i = 1; i <= totalPages; i++) {
    html += `<a class="page-btn${i === 1 ? ' active' : ''}" href="#" data-page="${i}">${i}</a>`;
  }

  $('.pagination').remove(); // 移除舊的
  // $('.pList').before('<div class="pagination">' + html + '</div>');
  $('.pList').after('<div class="pagination">' + html + '</div>');
}

// 顯示當頁產品
function renderPage(page) {
  const start = (page - 1) * perPage;
  const pageProducts = products.slice(start, start + perPage);

  let html = '';
  pageProducts.forEach(p => {
    html += renderBasicInfo(p);
  });

  $('.pList').html(html);
}

function renderBasicInfo($product) {
  const notes = $product.find('notes tip').map(function () {
    return `<li>${$(this).text()}</li>`;
  }).get().join('');

  return `
    <div class="p-box ${$product.find('num').text()}">
      <img src="${$product.find('img_url').text()}">

      <div class="num"><span>${$product.find('num').text()}</span></div>

      <div class="label">
        <div class="ages"><span>AGES</span>${$product.find('age').text()}<span>YEARS</span></div>
        <div class="title">${$product.find('brand').text()}</div>
        <div class="subtitle">${$product.find('subtitle').text()}</div>
        <div class="years">${$product.find('distillation_year').text()}</div>
      </div>

      <div><span>origin</span>${$product.find('origin').text()}</div>
      <div><span>area</span>${$product.find('area').text()}</div>
      <div><span>subarea</span>${$product.find('subarea').text()}</div>
      <div><span>distillation</span>${$product.find('distillation_year').text()}</div>
      <div><span>bottling</span>${$product.find('bottling_year').text()}</div>
      <div><span>ages</span>${$product.find('age').text()}</div>
      <div><span>capacity</span>${$product.find('capacity').text()}<span class="unit">ml</span></div>
      <div><span>strength</span>${$product.find('strength').text()}<span class="unit">%</span></div>
  
    </div>
  `;
}



$(document).on('click', '.areU_18 a', function() {
  $('body.overflow_hidden').removeClass('overflow_hidden');
  $('.popup').remove();
});



function getRandomImage() {

  var type = 0;
  var prefix ='';
  var randomNum = 0;
  var numStr ='';
  var imagePath = '';
  

  if (Math.floor(Math.random() * 2) + 1 < 2) {


    type = 1;
  } else {
    type = 2;
  }
  

  if (type === 1) {
    prefix = 'b00';
  } else {
    prefix = 'w00';
  }
  

  randomNum = Math.floor(Math.random() * 30) + 1;
  

  if (randomNum < 10) {
    numStr = '0' + randomNum.toString();
  } else {
    numStr = randomNum.toString();
  }



  imagePath = '<img class="popup_bg" src="../img_Alcohol/s/' + prefix + numStr + '-1.jpg">';

$('.popup > div').append(imagePath);

}
