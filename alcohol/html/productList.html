}
.three_line .line._b{

    -ms-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
}
.three_line .line._c{
    -webkit-transform: translate(-50%, calc(-50% + 6px));
    -ms-transform: translate(-50%, calc(-50% + 6px));
    transform: translate(-50%, calc(-50% + 6px));
}



/* jQ */

.three_line.click{
  background-color: #5d0b24;
}
.three_line.click .line._a{
  background-color: #fff;
    -webkit-transform: rotate(0deg) translate(-50%, -50%) rotate(45deg);
    -ms-transform: rotate(0deg) translate(-50%, -50%) rotate(45deg);
    transform: rotate(0deg) translate(-50%, -50%) rotate(45deg);
}
.three_line.click .line._b{
  background-color: #fff;

    left: -100%;
}
.three_line.click .line._c{
  background-color: #fff;
  -webkit-transform: rotate(0deg) translate(-50%, -50%) rotate(-45deg);
  -ms-transform: rotate(0deg) translate(-50%, -50%) rotate(-45deg);
  transform: rotate(0deg) translate(-50%, -50%) rotate(-45deg);
}


.three_line .line{
    -webkit-transition: width , height , 0.3s ease-in-out , -webkit-transform;
    transition: width , height , 0.3s ease-in-out , -webkit-transform;
    -o-transition: transform , width , height , 0.3s ease-in-out;
    transition: transform , width , height , 0.3s ease-in-out;
    transition: transform , width , height , background-color , 0.3s ease-in-out , -webkit-transform; 
    transition: transform , width , height , background-color , 0.3s ease-in-out; 
}

<script>

// === AAA 年份列表功能 ===
$(document).on('click', '.btn-vintages', function () {

    var yearMap = {}; // { 1978: [ {brand:'Dalmore', type:'whisky'}, ... ], ... }
    // 整理 psData 資料
    for (let i = 0; i < psData.length; i++) {
        const you = psData[i];
        const year = you.find('distillation_year').text();
        const brand = you.find('brand').text();
        const type = you.find('type').text().toLowerCase().split(/\s+/)[0];
        const num = you.find('num').text();
        const hmi = you.find('img_how_many').text();


        // 限制只取 1890~2000 年之間

        if (year) {

            const y = parseInt(year, 10);

            if (y >= 1890 && y <= 2000) {

                if (!yearMap[y]) {
                    yearMap[y] = [];
                }
                
                // yearMap[y].push({ brand: brand, type: type });

yearMap[y].push({ 
  brand: brand, 
  type: type,
  num: num,
  hmi: hmi 
});
            }
        }
    }

    // 取出所有年份並排序

    const years = [];

    for (const key in yearMap) {
        if ( yearMap.hasOwnProperty(key) ) {
            years.push(parseInt(key, 10));
        }
    }

    years.sort( function ( a , b ) {
     return b - a; 
   });

    // 組 HTML

    let html = '';
    for (let y = 0; y < years.length; y++) {
        const year = years[y];
        const brands = yearMap[year];

        let brandHtml = '';

        for (let j = 0; j < brands.length; j++) {
            // brandHtml += '<div class="yearItem btn_pBox color_' + brands[j].type + '">' + brands[j].brand + '</div>';
          brandHtml += 
            `<div class="yearItem btn_pBox" data-id="${brands[j].num}" data-hmi="${brands[j].hmi}">

            <div class="cup color_${brands[j].type}">&nbsp;</div>
            <span class="num">${brands[j].num}</span>
            ${brands[j].brand}</div>`;
        }

        html +=
        `<div class="yearBox" data-year="${year}">
          <div class="yearTitle">${year}</div>
          ${brandHtml}
        </div>`;
    }

    // 顯示在一個容器 (建議在 HTML 加 <div id="yearList"></div>)

    $('.pList').addClass('vintages').html(html);
    $('.pagination').remove();

});

var perPage = 30;
var psData = [];
var currentFilter = '';
var defaultFilter = 'whisky';
var totalPages = 0;
var filteredProducts = []; // 重命名以避免冲突
var hmWhisky = 60;
var hmBrandy = 45;

$(window).on('load', function() {

    loadProductsData();
    bindMenuEvents();

    $('.three_line').on('click', function() {
        $(this).toggleClass('click');
        return false;
    });
});

function loadProductsData() {

    $.ajax({
        url: '../xml/alcohol-on.xml',
        dataType: 'xml',
        success: function(xml) {

        $(xml).find('alcohol_info').each(function () {
          psData.push($(this));
        });

            if (defaultFilter) {
                applyFilter(defaultFilter);
            } else {
                renderAllProducts();
            }
            
            rLine();

          $('span.itemNum.whisky').text(hmWhisky);
          $('span.itemNum.brandy').text(hmBrandy);
        },
        error: function() {
            alert('资料载入失败，请检查 XML 路径或档案格式');
        }
    });
}

function applyFilter(type) {
    currentFilter = type;
    filteredProducts = filterProducts(type);
    totalPages = Math.ceil(filteredProducts.length / perPage);
    renderPagination(totalPages);
    render_ProductsListPage(1, filteredProducts);
    rLine();
}

  // 取出 <type> 的內容，轉小寫並拆成陣列
  // 檢查 tags 是否包含 typeLower

function filterProducts(type) {
    var typeLower = type.toLowerCase();
    return psData.filter(function ($p) {

      var tags = $p.find('type').text().toLowerCase().split(/\s+/);

      return tags.includes(typeLower);
    });
}

function renderAllProducts() {
    totalPages = Math.ceil(psData.length / perPage);
    renderPagination(totalPages);
    render_ProductsListPage(1, psData);
}

function bindMenuEvents() {

    $('.alcohol_menu').each(function() {
        let ts = $(this);
        
        ts.find('a').on('click', function(e) {
            e.preventDefault();

        
            ts.find('.click').removeClass('click');

            $(this).addClass('click');

            $('.pList').removeClass().addClass('pList');

            $('html, body').animate({ scrollTop: 0 }, 'smooth');

            $('.three_line').toggleClass('click');

    let type = $(this).data('type');
            applyFilter(type);



        });

        // ts.find('a:not(.alcohol_menu > a:first-child)').on('click', function(e) {
        //     e.preventDefault();
        //     $('.three_line').toggleClass('click');
        // });
    });
    
    // 分页事件绑定
    $(document).on('click', '.pagination .page-btn', function() {
        var page = $(this).data('page');
        
        if (currentFilter) {
            render_ProductsListPage(page, filteredProducts);
        } else {
            render_ProductsListPage(page, psData);
        }
        
        $('.pagination .page-btn').removeClass('active');
        $(this).addClass('active');
        rLine();
    });

    $(document).on('click', '.category a', function(e) {

      $('.pList').removeClass().addClass('pList');

      e.preventDefault();
      let type = $(this).data('type');
      applyFilter(type);
    });

}

function renderPagination(totalPages) {
    var html = '';
    for (var i = 1; i <= totalPages; i++) {
        html += '<a class="page-btn' + (i === 1 ? ' active' : '') + '" href="#" data-page="' + i + '">' + i + '</a>';
    }
    $('.pagination').remove();
    $('.pList').after('<div class="pagination">' + html + '</div>');
}

function render_ProductsListPage(page, list) {
    // var data = list || psData;
    var data = list;
    var start = (page - 1) * perPage;
    var pageProducts = data.slice(start, start + perPage);
    var html = '';
    
    for (var i = 0; i < pageProducts.length; i++) {
        var p = pageProducts[i];
        html += type_ProductsList(p);
    }
    
    $('.pList').html(html);
}

$(document).on('click', '.btn_pBox', function () {

  if ($(this).data('hmi') !== 0) {

    $('.pList').addClass('productPage');
    const imgId = $(this).data('id'); 
    const product = psData.find( p => p.find('num').text() === imgId);
    let categoryHtml = '';

  if (product) {
    const fullType = product.find('type').text();
    const type = fullType.split(' ')[0];
    const brand = product.find('brand').text();
    categoryHtml = `
      <div class="category">
        <a href="#" data-type="${type}">${type}</a><span>${brand}</span>
      </div>
    `;

    applyFilter(type);

  }

  let showImagesHtml = '';
  const imgNum = product.find('img_how_many').text();

  for (let i = 1; i <= imgNum; i++) {
    showImagesHtml += `
      <div>
        <img src="../img_Alcohol/b/${imgId}-${i}.jpg">
      </div>`;
  }

  const slideShowHtml = `
    <div class="slide_show">
      <div class="img_Box">
        ${showImagesHtml}
      </div>
    </div>
  `;

$('.pList').removeClass().addClass('pList').html(categoryHtml + slideShowHtml);
$('.pagination').remove();
}

$('html, body').animate({ scrollTop: 0 }, 'smooth');
});

function rLine() {
    $('.label > *').each(function() {
        const ts = $(this);
        const text = ts.text().trim();
        const hasSpan = ts.find('span').length > 0;
        const hasDash = text.indexOf('-') !== -1;
        if (text === '-') {
            ts.hide();
        }else if (hasSpan && hasDash) {
            ts.hide();
        }
    });
}

    $('body.overflow_hidden').removeClass('overflow_hidden');
    $('.popup').remove();
